name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK dosyasını adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Kalbim-Sohbet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kalbim-Sohbet
          path: Kalbim-Sohbet.apk

      - name: Release olarak yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kalbim Sohbet ${{ github.run_number }}
          files: Kalbim-Sohbet.apk
          make_latest: true
